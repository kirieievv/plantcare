<style>
  #botanly-loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #botanly-loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .bl-sprout {
    width: 120px;
    height: 120px;
  }

  /* Halo pulse */
  .bl-halo {
    transform-origin: 50px 50px;
    animation: bl-halo-pulse 2.4s ease-in-out infinite;
  }
  @keyframes bl-halo-pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50%       { opacity: 0.85; transform: scale(1.15); }
  }

  /* Bob up/down */
  .bl-plant {
    transform-origin: 50px 50px;
    animation: bl-bob 2.4s ease-in-out infinite;
  }
  @keyframes bl-bob {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-3px); }
  }

  /* Stem grows */
  .bl-stem {
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: bl-stem-grow 0.84s cubic-bezier(0.25,0.46,0.45,0.94) 0s forwards,
               bl-bob 2.4s ease-in-out infinite;
    transform-origin: 50px 50px;
  }
  @keyframes bl-stem-grow {
    to { stroke-dashoffset: 0; }
  }

  /* Left leaf */
  .bl-leaf-left {
    transform-origin: 50px 56px;
    opacity: 0;
    animation: bl-leaf-left-bloom 0.67s cubic-bezier(0.34,1.56,0.64,1) 0.77s forwards;
  }
  @keyframes bl-leaf-left-bloom {
    0%   { opacity: 1; transform: scale(0) rotate(-30deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* Right leaf */
  .bl-leaf-right {
    transform-origin: 50px 50px;
    opacity: 0;
    animation: bl-leaf-right-bloom 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.91s forwards;
  }
  @keyframes bl-leaf-right-bloom {
    0%   { opacity: 1; transform: scale(0) rotate(30deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* Dots */
  .bl-dots {
    display: flex;
    gap: 5px;
    margin-top: 20px;
  }
  .bl-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4A8C33;
    animation: bl-dot-bounce 2.4s ease-in-out infinite;
  }
  .bl-dot:nth-child(1) { animation-delay: 0s; }
  .bl-dot:nth-child(2) { animation-delay: 0.343s; }
  .bl-dot:nth-child(3) { animation-delay: 0.686s; }
  @keyframes bl-dot-bounce {
    0%, 100% { transform: scale(0.7); opacity: 0.4; }
    30%       { transform: scale(1.0); opacity: 1.0; }
    60%       { transform: scale(0.7); opacity: 0.4; }
  }
</style>

<div id="botanly-loader">
  <svg class="bl-sprout" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

    <circle class="bl-halo" cx="50" cy="50" r="42" fill="url(#haloGrad)"/>
    <defs>

        <stop offset="70%" stop-color="#7EC665" stop-opacity="0"/>

    </defs>

    <g class="bl-plant">
      <!-- Ground line -->

      <!-- Stem -->
      <path class="bl-stem" d="M50 86 C48 70 52 60 50 40"

      <!-- Left leaf -->
      <path class="bl-leaf-left"

      <!-- Left vein -->
      <line class="bl-leaf-left" x1="50" y1="56" x2="26" y2="44"
        stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>

      <!-- Right leaf -->

        fill="#5FA346"/>
      <!-- Right vein -->
      <line class="bl-leaf-right" x1="50" y1="50" x2="74" y2="38"
        stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </g>
  </svg>

  <div class="bl-dots">
    <div class="bl-dot"></div>
    <div class="bl-dot"></div>
    <div class="bl-dot"></div>
  </div>
</div>

<script>
  (function() {
    function hideLoader() {
      var loader = document.getElementById('botanly-loader');
      if (!loader) return;
      loader.classList.add('hidden');
      setTimeout(function() { if (loader.parentNode) loader.remove(); }, 500);
    }

    // Primary: watch for Flutter's root element appearing in DOM
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          if (nodes[j].tagName && nodes[j].tagName.toLowerCase() === 'flt-glass-pane') {
            observer.disconnect();
            setTimeout(hideLoader, 200);
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: false });

    // Fallback: hide after 15s no matter what
    setTimeout(function() {
      observer.disconnect();
      hideLoader();
    }, 15000);
  })();
</script>
